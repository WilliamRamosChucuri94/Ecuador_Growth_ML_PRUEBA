
name: Prediccion automatica PIB

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  prediccion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Generar predicciones
        run: python predecir.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: predicciones-pib
          path: predicciones.csv
